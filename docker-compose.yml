services:
  bridge:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: claudecode-telegram-bridge
    restart: unless-stopped
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TMUX_SESSION=${TMUX_SESSION:-claude}
      - PORT=${PORT:-8080}
      - HOST=0.0.0.0
      - TELEGRAM_REACTION_EMOJI=${TELEGRAM_REACTION_EMOJI:-}
      - TMUX_SOCKET_PATH=/tmux-socket
      - DM_ALLOWED_USER_ID=${DM_ALLOWED_USER_ID}
      - ALLOWED_TELEGRAM_USER_IDS=${ALLOWED_TELEGRAM_USER_IDS}
      - TELEGRAM_WEBHOOK_SECRET=${TELEGRAM_WEBHOOK_SECRET}
      - WEBHOOK_PATH=${WEBHOOK_PATH}
      - CLAUDE_DIR=/claude
      - DEPLOYMENT_MODE=${DEPLOYMENT_MODE}
      - WEBHOOK_DOMAIN=${WEBHOOK_DOMAIN}
      - WEBHOOK_AUTO_SETUP=${WEBHOOK_AUTO_SETUP:-true}
      - WEBHOOK_STARTUP_DELAY=${WEBHOOK_STARTUP_DELAY:-5}
    volumes:
      # Mount tmux socket for Claude Code communication
      - ${TMUX_SOCKET:-/tmp/tmux-1000/default}:/tmux-socket:ro
      # Mount Claude config directory for chat_id, pending file, and history
      - ${CLAUDE_DIR:-${HOME}/.claude}:/claude:rw
    # No ports exposed - only accessible via Caddy reverse proxy on internal network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - claude-telegram-net

  caddy:
    image: caddy:latest
    container_name: claudecode-telegram-caddy
    restart: unless-stopped
    # Ports only exposed when USE_CLOUDFLARE_TUNNEL=false (production with public IP)
    ports:
      - "${CADDY_HTTP_PORT:-8081}:80"
      - "${CADDY_HTTPS_PORT:-8443}:443"
      - "${CADDY_HTTPS_PORT:-8443}:443/udp" # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - TELEGRAM_WEBHOOK_PATH=${TELEGRAM_WEBHOOK_PATH:-/webhook}
    networks:
      - claude-telegram-net
    depends_on:
      - bridge
    profiles:
      - production

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: claudecode-telegram-cloudflared
    restart: unless-stopped
    command: >
      sh -c '
        set -eu
        rm -f /claude/cloudflared_tunnel_url
        cloudflared tunnel --no-autoupdate --url http://bridge:8080 2>&1 |
        while IFS= read -r line; do
          printf "%s\n" "$line"
          case "$line" in
            *trycloudflare.com*)
              url=$(printf "%s" "$line" | sed -n "s/.*\\(https:\\/\\/[a-z0-9-]*\\.trycloudflare\\.com\\).*/\\1/p")
              if [ -n "$url" ]; then printf "%s" "$url" > /claude/cloudflared_tunnel_url; fi
              ;;
          esac
        done
      '
    networks:
      - claude-telegram-net
    volumes:
      # Share Claude config directory so cloudflared can publish its quick-tunnel URL
      - ${CLAUDE_DIR:-${HOME}/.claude}:/claude:rw
    depends_on:
      bridge:
        condition: service_started
    healthcheck:
      # File-based healthcheck - cloudflared writes tunnel URL to this file when ready
      # More reliable than wget/curl which may not exist in the cloudflared image
      test: ["CMD", "test", "-f", "/claude/cloudflared_tunnel_url"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    profiles:
      - tunnel

networks:
  claude-telegram-net:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
